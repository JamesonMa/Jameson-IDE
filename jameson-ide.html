<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jameson IDE</title>
<style>
:root {
  --bg-primary: #1e1e1e;
  --bg-secondary: #252526;
  --bg-tertiary: #2d2d30;
  --bg-hover: #2a2d2e;
  --bg-active: #37373d;
  --text-primary: #cccccc;
  --text-secondary: #969696;
  --text-muted: #6a6a6a;
  --border-color: #3e3e42;
  --accent: #007acc;
  --accent-hover: #1a8ad4;
  --tab-active-border: #007acc;
  --sidebar-width: 260px;
  --activity-bar-width: 48px;
  --tab-height: 35px;
  --status-bar-height: 24px;
  --font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  --font-mono: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', Consolas, monospace;
  --font-size: 13px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  height: 100%; width: 100%; overflow: hidden;
  font-family: var(--font-family); font-size: var(--font-size);
  color: var(--text-primary); background: var(--bg-primary);
}
#app {
  display: grid;
  grid-template-columns: var(--activity-bar-width) var(--sidebar-width) 1fr;
  grid-template-rows: 1fr var(--status-bar-height);
  grid-template-areas: "activity sidebar main" "status status status";
  height: 100vh; width: 100vw;
}
/* Activity Bar */
.activity-bar {
  grid-area: activity; background: #181818;
  display: flex; flex-direction: column; align-items: center;
  padding: 4px 0; border-right: 1px solid var(--border-color);
}
.activity-bottom { margin-top: auto; display: flex; flex-direction: column; align-items: center; }
.activity-icon {
  width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--text-muted); position: relative; transition: color 0.15s;
}
.activity-icon:hover { color: var(--text-primary); }
.activity-icon.active { color: #fff; }
.activity-icon.active::before {
  content: ''; position: absolute; left: 0; top: 6px; bottom: 6px;
  width: 2px; background: #fff; border-radius: 0 1px 1px 0;
}
/* Sidebar */
.sidebar-wrapper { grid-area: sidebar; display: flex; overflow: hidden; }
.sidebar { flex: 1; background: var(--bg-secondary); display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
.sidebar-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 12px; height: 35px; min-height: 35px;
  font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 1.2px; color: var(--text-secondary);
  border-bottom: 1px solid var(--border-color);
}
.sidebar-actions { display: flex; gap: 2px; }
.sidebar-action-btn {
  background: none; border: none; color: var(--text-secondary);
  cursor: pointer; padding: 4px; border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.1s, color 0.1s;
}
.sidebar-action-btn:hover { color: var(--text-primary); background: var(--bg-hover); }
.sidebar-content { flex: 1; overflow-y: auto; overflow-x: hidden; }
.sidebar-resize-handle {
  width: 4px; cursor: col-resize; background: transparent;
  transition: background 0.15s; flex-shrink: 0;
}
.sidebar-resize-handle:hover, .sidebar-resize-handle:active { background: var(--accent); }
/* File Tree */
.file-tree { padding: 2px 0; }
.tree-item {
  display: flex; align-items: center; padding: 1px 0; padding-right: 8px;
  cursor: pointer; user-select: none; white-space: nowrap; height: 22px;
  font-size: var(--font-size); color: var(--text-primary); transition: background 0.08s;
}
.tree-item:hover { background: var(--bg-hover); }
.tree-item.active { background: var(--bg-active); }
.tree-item-icon {
  margin-right: 4px; font-size: 16px; flex-shrink: 0; width: 16px; height: 16px;
  display: flex; align-items: center; justify-content: center;
}
.tree-item-name { overflow: hidden; text-overflow: ellipsis; line-height: 22px; }
.tree-children { display: none; }
.tree-children.expanded { display: block; }
/* Main Area */
.main-area { grid-area: main; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
/* Tab Bar */
.tab-bar {
  height: var(--tab-height); background: var(--bg-tertiary);
  display: flex; align-items: stretch; overflow-x: auto; overflow-y: hidden;
  border-bottom: 1px solid var(--border-color); flex-shrink: 0;
}
.tab-bar::-webkit-scrollbar { height: 3px; }
.tab-bar::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 3px; }
.tab {
  display: flex; align-items: center; padding: 0 10px; min-width: 80px; max-width: 200px;
  cursor: pointer; border-right: 1px solid var(--border-color); font-size: 12px;
  color: var(--text-secondary); white-space: nowrap; user-select: none;
  position: relative; background: var(--bg-tertiary); transition: background 0.1s;
}
.tab:hover { background: var(--bg-hover); }
.tab.active { background: var(--bg-primary); color: var(--text-primary); }
.tab.active::after {
  content: ''; position: absolute; top: 0; left: 0; right: 0;
  height: 1px; background: var(--tab-active-border);
}
.tab.modified .tab-name::after {
  content: ' \25CF'; color: var(--accent); font-size: 8px;
  vertical-align: middle; margin-left: 2px;
}
.tab-name { overflow: hidden; text-overflow: ellipsis; flex: 1; }
.tab-close {
  margin-left: 4px; opacity: 0; background: none; border: none;
  color: var(--text-secondary); cursor: pointer; padding: 2px;
  border-radius: 4px; display: flex; align-items: center; justify-content: center;
  width: 18px; height: 18px; font-size: 13px; transition: background 0.1s, color 0.1s;
}
.tab:hover .tab-close, .tab.active .tab-close { opacity: 1; }
.tab-close:hover { background: var(--bg-active); color: var(--text-primary); }
/* Editor */
.editor-container { flex: 1; overflow: hidden; position: relative; }
.editor-instance { width: 100%; height: 100%; display: none; }
.editor-instance.active { display: block; }
/* Welcome */
.editor-welcome {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 100%; gap: 8px; animation: fadeIn 0.4s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.welcome-logo { margin-bottom: 8px; opacity: 0.9; }
.welcome-title { font-size: 26px; font-weight: 300; color: var(--text-primary); letter-spacing: 0.5px; }
.welcome-subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }
.welcome-actions { margin-bottom: 32px; }
.welcome-btn {
  display: inline-flex; align-items: center; gap: 8px; padding: 8px 20px;
  background: var(--accent); color: #fff; border: none; border-radius: 4px;
  font-size: 13px; font-family: var(--font-family); cursor: pointer;
  transition: background 0.15s;
}
.welcome-btn:hover { background: var(--accent-hover); }
.welcome-shortcuts { display: flex; flex-direction: column; gap: 8px; color: var(--text-muted); font-size: 12px; }
.shortcut-row { display: flex; align-items: center; gap: 6px; }
.shortcut-row span { margin-left: 12px; color: var(--text-secondary); }
kbd {
  background: var(--bg-tertiary); border: 1px solid var(--border-color);
  border-radius: 3px; padding: 2px 6px; font-family: var(--font-family);
  font-size: 11px; color: var(--text-primary); line-height: 1.4;
}
/* Status Bar */
.status-bar {
  grid-area: status; background: #007acc; color: #fff;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 10px; font-size: 12px; line-height: var(--status-bar-height);
}
.status-bar-left, .status-bar-right { display: flex; align-items: center; gap: 0; }
.status-item {
  padding: 0 8px; cursor: default; white-space: nowrap;
  display: flex; align-items: center; gap: 4px; height: 100%;
  transition: background 0.1s;
}
.status-item:hover { background: rgba(255,255,255,0.12); }
/* Context Menu */
.context-menu {
  position: fixed; background: #2d2d30; border: 1px solid #454545;
  border-radius: 5px; padding: 4px 0; min-width: 180px; z-index: 1000;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5); animation: menuFadeIn 0.1s ease;
}
@keyframes menuFadeIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
.context-menu-item {
  padding: 5px 24px; cursor: pointer; font-size: var(--font-size);
  color: var(--text-primary); transition: background 0.08s;
}
.context-menu-item:hover { background: var(--accent); color: #fff; }
.context-menu-separator { height: 1px; background: var(--border-color); margin: 4px 12px; }
.tree-item-input {
  background: var(--bg-primary); border: 1px solid var(--accent);
  color: var(--text-primary); font-family: var(--font-family);
  font-size: var(--font-size); padding: 1px 4px; outline: none;
  width: 100%; border-radius: 2px;
}
/* Dialog */
.dialog-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5); z-index: 1001;
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(2px);
}
.dialog-box {
  background: #2d2d30; border: 1px solid #454545; border-radius: 8px;
  padding: 20px; min-width: 340px; box-shadow: 0 12px 40px rgba(0,0,0,0.5);
}
.dialog-label { margin-bottom: 10px; font-size: 13px; color: #969696; }
.dialog-input {
  width: 100%; background: #1e1e1e; border: 1px solid #3e3e42;
  color: #cccccc; padding: 8px 10px; font-size: 13px;
  border-radius: 4px; outline: none; font-family: var(--font-family);
}
.dialog-input:focus { border-color: var(--accent); }
/* Scrollbar */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: rgba(121,121,121,0.3); border-radius: 4px;
  border: 2px solid transparent; background-clip: padding-box;
}
::-webkit-scrollbar-thumb:hover { background: rgba(121,121,121,0.5); background-clip: padding-box; }
/* Notification */
.notification {
  position: fixed; top: 12px; right: 12px; z-index: 2000;
  background: #252526; border: 1px solid #454545; border-radius: 6px;
  padding: 10px 16px; font-size: 13px; color: var(--text-primary);
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  animation: slideIn 0.2s ease; max-width: 360px;
}
@keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
.notification.error { border-left: 3px solid #f44747; }
.notification.info { border-left: 3px solid var(--accent); }
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
// === Monaco Editor from CDN ===
const MONACO_CDN = 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs';

const monacoScript = document.createElement('script');
monacoScript.src = `${MONACO_CDN}/loader.js`;
document.head.appendChild(monacoScript);

await new Promise(resolve => monacoScript.onload = resolve);

const require = window.require;
require.config({ paths: { vs: MONACO_CDN } });

let monaco;
await new Promise(resolve => {
  require(['vs/editor/editor.main'], (m) => { monaco = m; resolve(); });
});

// === File System State ===
let workspaceRoot = null;          // FileSystemDirectoryHandle
let workspaceName = '';
const fileHandles = new Map();     // path -> FileSystemFileHandle
const dirHandles = new Map();      // path -> FileSystemDirectoryHandle
const fileCache = new Map();       // path -> { content, dirty }

// === File System Access API ===
async function openFolder() {
  try {
    workspaceRoot = await window.showDirectoryPicker();
    workspaceName = workspaceRoot.name;
    fileHandles.clear();
    dirHandles.clear();
    fileCache.clear();
    for (const [path, tab] of tabs) { tab.editor.dispose(); tab.model.dispose(); tab.container.remove(); tab.tabEl.remove(); }
    tabs.clear();
    activeTab = null;
    document.title = `${workspaceName} — Jameson IDE`;
    await refreshFileTree();
  } catch (e) {
    if (e.name !== 'AbortError') notify('Failed to open folder: ' + e.message, 'error');
  }
}

// Read only ONE level of a directory (no recursion)
async function listDir(handle, basePath) {
  const entries = [];
  try {
    // Collect all entries first, then filter
    const allEntries = [];
    for await (const entry of handle) {
      allEntries.push(entry);
    }
    console.log('Raw entries for', basePath || '(root)', ':', allEntries.length);

    for (const entry of allEntries) {
      const name = entry[0];
      const childHandle = entry[1];
      console.log('  Entry:', name, 'kind:', childHandle.kind);
      if (name.startsWith('.') || name === 'node_modules' || name === 'dist' || name === '.git') continue;
      const fullPath = basePath ? `${basePath}/${name}` : name;
      if (childHandle.kind === 'directory') {
        dirHandles.set(fullPath, childHandle);
        entries.push({ name, path: fullPath, type: 'directory', loaded: false });
      } else if (childHandle.kind === 'file') {
        fileHandles.set(fullPath, childHandle);
        entries.push({ name, path: fullPath, type: 'file' });
      }
    }
  } catch (e) {
    console.error('listDir error for', basePath, e);
    notify('Error reading directory: ' + e.message, 'error');
  }
  entries.sort((a, b) => {
    if (a.type !== b.type) return a.type === 'directory' ? -1 : 1;
    return a.name.localeCompare(b.name);
  });
  return entries;
}

async function readFile(path) {
  if (fileCache.has(path) && !fileCache.get(path).dirty) {
    return fileCache.get(path).content;
  }
  const handle = fileHandles.get(path);
  if (!handle) {
    console.error('No handle for path:', path, 'Available handles:', [...fileHandles.keys()]);
    throw new Error('File not found: ' + path);
  }
  try {
    const file = await handle.getFile();
    const content = await file.text();
    fileCache.set(path, { content, dirty: false });
    return content;
  } catch (e) {
    console.error('readFile error for', path, e);
    throw new Error('Cannot read file: ' + e.message);
  }
}

async function writeFile(path, content) {
  const handle = fileHandles.get(path);
  if (!handle) throw new Error('File not found');
  const writable = await handle.createWritable();
  await writable.write(content);
  await writable.close();
  fileCache.set(path, { content, dirty: false });
}

// === File Extension Colors ===
const EXT_COLORS = {
  '.ts':'#3178c6','.tsx':'#3178c6','.js':'#f1e05a','.jsx':'#f1e05a',
  '.html':'#e44b23','.css':'#563d7c','.scss':'#c6538c','.json':'#f1e05a',
  '.md':'#519aba','.txt':'#cccccc','.py':'#3572a5','.go':'#00add8',
  '.rs':'#dea584','.java':'#b07219','.cs':'#178600','.cpp':'#f34b7d',
  '.c':'#555555','.h':'#555555','.sh':'#89e051','.xml':'#0060ac',
  '.yaml':'#cb171e','.yml':'#cb171e','.toml':'#9c4221','.sql':'#e38c00',
  '.php':'#4f5d95','.rb':'#cc342d','.png':'#a074c4','.jpg':'#a074c4',
  '.svg':'#a074c4','.gif':'#a074c4',
};

function fileIconSvg(name) {
  const ext = name.substring(name.lastIndexOf('.')).toLowerCase();
  const c = EXT_COLORS[ext] || '#cccccc';
  return `<svg width="16" height="16" viewBox="0 0 16 16" fill="${c}"><path d="M9.5 1h-4a.5.5 0 00-.5.5v13a.5.5 0 00.5.5h5a.5.5 0 00.5-.5V4.5L9.5 1zM10 2.5L12.5 5H10V2.5z"/></svg>`;
}

const FOLDER_ICON = `<svg width="16" height="16" viewBox="0 0 16 16" fill="#dcb67a"><path d="M14 4H9L7.5 2.5H2a1 1 0 00-1 1v9a1 1 0 001 1h12a1 1 0 001-1V5a1 1 0 00-1-1z"/></svg>`;
const FOLDER_OPEN_ICON = `<svg width="16" height="16" viewBox="0 0 16 16" fill="#dcb67a"><path d="M1.5 1h5l1.5 1.5H14a1 1 0 011 1V13a1 1 0 01-1 1H2a1 1 0 01-1-1V2a1 1 0 011-.5z"/></svg>`;

function detectLanguage(name) {
  const ext = name.substring(name.lastIndexOf('.')).toLowerCase();
  const map = {
    '.ts':'typescript','.tsx':'typescript','.js':'javascript','.jsx':'javascript',
    '.html':'html','.htm':'html','.css':'css','.scss':'scss','.less':'less',
    '.json':'json','.md':'markdown','.txt':'plaintext','.py':'python',
    '.go':'go','.rs':'rust','.java':'java','.cs':'csharp',
    '.cpp':'cpp','.c':'c','.h':'c','.sh':'shell','.bat':'bat',
    '.xml':'xml','.yaml':'yaml','.yml':'yaml','.toml':'toml',
    '.sql':'sql','.php':'php','.rb':'ruby',
  };
  return map[ext] || 'plaintext';
}

// === Editor Manager ===
const tabs = new Map(); // path -> { editor, model, tabEl, container, dirty, name }
let activeTab = null;

function openFileInEditor(path, name) {
  if (tabs.has(path)) { activateTab(path); return; }

  const tabBar = document.getElementById('tab-bar');
  const editorContainer = document.getElementById('editor-container');

  if (!tabBar || !editorContainer) {
    console.error('Editor containers not found');
    return;
  }

  const welcome = document.getElementById('editor-welcome');
  if (welcome) welcome.style.display = 'none';

  const container = document.createElement('div');
  container.className = 'editor-instance';
  editorContainer.appendChild(container);

  const language = detectLanguage(name);
  const uri = monaco.Uri.file(path);
  let model = monaco.editor.getModel(uri);
  const cached = fileCache.get(path);

  if (!model) {
    model = monaco.editor.createModel(cached?.content || '', language, uri);
  }

  const editor = monaco.editor.create(container, {
    model, theme: 'vs-dark', automaticLayout: true,
    minimap: { enabled: true }, fontSize: 14,
    fontFamily: "'Cascadia Code','Fira Code',Consolas,monospace",
    lineNumbers: 'on', scrollBeyondLastLine: false,
    wordWrap: 'off', tabSize: 4, renderWhitespace: 'selection',
    bracketPairColorization: { enabled: true },
    smoothScrolling: true, cursorSmoothCaretAnimation: 'on',
  });

  model.onDidChangeContent(() => {
    const tab = tabs.get(path);
    if (tab) { tab.dirty = true; tab.tabEl.classList.add('modified'); }
  });

  editor.onDidChangeCursorPosition((e) => {
    if (activeTab === path) {
      document.getElementById('status-position').textContent = `Ln ${e.position.lineNumber}, Col ${e.position.column}`;
    }
  });

  // Ctrl+S
  editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS, async () => {
    const tab = tabs.get(path);
    if (!tab) return;
    try {
      await writeFile(path, tab.model.getValue());
      tab.dirty = false;
      tab.tabEl.classList.remove('modified');
      notify('Saved ' + name, 'info');
    } catch (e) {
      notify('Save failed: ' + e.message, 'error');
    }
  });

  const tabEl = document.createElement('div');
  tabEl.className = 'tab';
  const tabName = document.createElement('span');
  tabName.className = 'tab-name';
  tabName.textContent = name;
  const closeButton = document.createElement('button');
  closeButton.className = 'tab-close';
  closeButton.textContent = '×';
  closeButton.setAttribute('aria-label', `Close ${name}`);
  tabEl.append(tabName, closeButton);
  closeButton.addEventListener('click', (e) => { e.stopPropagation(); closeTab(path); });
  tabEl.addEventListener('click', () => activateTab(path));
  tabBar.appendChild(tabEl);

  tabs.set(path, { editor, model, tabEl, container, dirty: false, name });
  activateTab(path);
}

function activateTab(path) {
  for (const [, t] of tabs) { t.container.classList.remove('active'); t.tabEl.classList.remove('active'); }
  const tab = tabs.get(path);
  if (!tab) return;
  tab.container.classList.add('active');
  tab.tabEl.classList.add('active');
  tab.editor.layout();
  tab.editor.focus();
  activeTab = path;
  tab.tabEl.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
  document.getElementById('status-language').textContent = detectLanguage(tab.name);
  const pos = tab.editor.getPosition();
  if (pos) document.getElementById('status-position').textContent = `Ln ${pos.lineNumber}, Col ${pos.column}`;
}

async function closeTab(path, force = false) {
  const tab = tabs.get(path);
  if (!tab) return;
  if (tab.dirty && !force) {
    if (confirm(`Save changes to "${tab.name}" before closing?`)) {
      try { await writeFile(path, tab.model.getValue()); tab.dirty = false; }
      catch (e) { notify('Save failed: ' + e.message, 'error'); return; }
    } else if (!confirm(`Discard changes to "${tab.name}"?`)) return;
  }
  tab.editor.dispose();
  tab.model.dispose();
  tab.container.remove();
  tab.tabEl.remove();
  tabs.delete(path);
  if (activeTab === path) {
    const remaining = Array.from(tabs.keys());
    if (remaining.length > 0) activateTab(remaining[remaining.length - 1]);
    else {
      activeTab = null;
      const w = document.getElementById('editor-welcome');
      if (w) w.style.display = '';
    }
  }
}

// === Notification ===
function notify(msg, type = 'info') {
  const el = document.createElement('div');
  el.className = `notification ${type}`;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

// === Prompt Dialog ===
function promptInput(label) {
  return new Promise(resolve => {
    const overlay = document.createElement('div');
    overlay.className = 'dialog-overlay';
    overlay.innerHTML = `<div class="dialog-box">
      <div class="dialog-label">${label}</div>
      <input class="dialog-input" autofocus>
    </div>`;
    const input = overlay.querySelector('input');
    const done = (val) => { overlay.remove(); resolve(val); };
    input.addEventListener('keydown', e => { if (e.key === 'Enter') done(input.value.trim() || null); if (e.key === 'Escape') done(null); });
    overlay.addEventListener('click', e => { if (e.target === overlay) done(null); });
    document.body.appendChild(overlay);
    input.focus();
  });
}

// === Context Menu ===
function showContextMenu(x, y, items) {
  removeContextMenu();
  const menu = document.createElement('div');
  menu.className = 'context-menu';
  menu.id = 'ctx-menu';
  menu.style.left = x + 'px';
  menu.style.top = y + 'px';
  for (const item of items) {
    if (item.separator) { menu.appendChild(Object.assign(document.createElement('div'), { className: 'context-menu-separator' })); continue; }
    const el = document.createElement('div');
    el.className = 'context-menu-item';
    el.textContent = item.label;
    el.addEventListener('click', () => { removeContextMenu(); item.action?.(); });
    menu.appendChild(el);
  }
  document.body.appendChild(menu);
  const r = menu.getBoundingClientRect();
  if (r.right > window.innerWidth) menu.style.left = (x - r.width) + 'px';
  if (r.bottom > window.innerHeight) menu.style.top = (y - r.height) + 'px';
  setTimeout(() => document.addEventListener('click', removeContextMenu, { once: true }), 0);
}

});

});

// === File Tree Rendering ===
async function refreshFileTree() {
  if (!workspaceRoot) return;
  console.log('Refreshing tree for:', workspaceRoot.name);
  const nodes = await listDir(workspaceRoot, '');
  console.log('Found', nodes.length, 'entries:', nodes.map(n => n.name));
  sidebarContent.innerHTML = '';
  const tree = document.createElement('div');
  tree.className = 'file-tree';
  for (const node of nodes) tree.appendChild(createTreeNode(node, 0));
  sidebarContent.appendChild(tree);
}

function createTreeNode(node, depth) {
  const item = document.createElement('div');
  const row = document.createElement('div');
  row.className = 'tree-item';
  row.style.paddingLeft = (8 + depth * 16) + 'px';

  const icon = document.createElement('span');
  icon.className = 'tree-item-icon';
  icon.innerHTML = node.type === 'directory' ? FOLDER_ICON : fileIconSvg(node.name);

  const name = document.createElement('span');
  name.className = 'tree-item-name';
  name.textContent = node.name;

  row.appendChild(icon);
  row.appendChild(name);
  item.appendChild(row);

  if (node.type === 'directory') {
    const children = document.createElement('div');
    children.className = 'tree-children';
    item.appendChild(children);

    let expanded = false;
    let loaded = false;

    row.addEventListener('click', async () => {
      expanded = !expanded;
      if (expanded && !loaded) {
        // Lazy-load children on first expand
        const handle = dirHandles.get(node.path);
        if (handle) {
          const childNodes = await listDir(handle, node.path);
          for (const child of childNodes) {
            children.appendChild(createTreeNode(child, depth + 1));
          }
          loaded = true;
        }
      }
      children.classList.toggle('expanded', expanded);
      icon.innerHTML = expanded ? FOLDER_OPEN_ICON : FOLDER_ICON;
    });

    row.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      showContextMenu(e.clientX, e.clientY, [
        { label: 'New File', action: () => createNewFile(node.path) },
        { label: 'New Folder', action: () => createNewFolder(node.path) },
      ]);
    });
  } else {
    row.addEventListener('click', async () => {
      sidebarContent.querySelectorAll('.tree-item.active').forEach(el => el.classList.remove('active'));
      row.classList.add('active');
      try {
        const content = await readFile(node.path);
        fileCache.set(node.path, { content, dirty: false });
        openFileInEditor(node.path, node.name);
      } catch (e) {
        notify('Failed to read file: ' + e.message, 'error');
      }
    });
  }

  return item;
}

async function createNewFile(parentPath) {
  const name = await promptInput('New File Name');
  if (!name) return;
  try {
    const parentHandle = parentPath ? dirHandles.get(parentPath) : workspaceRoot;
    let newHandle;
    try { await parentHandle.getFileHandle(name, { create: false }); throw new Error('A file with that name already exists'); }
    catch (e) { if (e?.name !== 'NotFoundError') throw e; newHandle = await parentHandle.getFileHandle(name, { create: true }); }
    const writable = await newHandle.createWritable();
    await writable.write('');
    await writable.close();
    await refreshFileTree();
    const newPath = parentPath ? `${parentPath}/${name}` : name;
    fileHandles.set(newPath, newHandle);
    fileCache.set(newPath, { content: '', dirty: false });
    openFileInEditor(newPath, name);
  } catch (e) {
    notify('Failed to create file: ' + e.message, 'error');
  }
}

async function createNewFolder(parentPath) {
  const name = await promptInput('New Folder Name');
  if (!name) return;
  try {
    const parentHandle = parentPath ? dirHandles.get(parentPath) : workspaceRoot;
    await parentHandle.getDirectoryHandle(name, { create: true });
    await refreshFileTree();
  } catch (e) {
    notify('Failed to create folder: ' + e.message, 'error');
  }
}
